<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aegis Ambient Care — Secure Portal Access</title>
  <meta name="description" content="Secure login portal for family members, sons, clinicians, and first responders.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/dashboard.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
      background-color: var(--bg-deep);
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Glow Spheres */
    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
      top: -100px;
      left: 20%;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
      bottom: -80px;
      right: 20%;
      pointer-events: none;
      z-index: 0;
    }

    .login-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-glass-specular);
      border-radius: var(--radius-hero);
      padding: 42px 36px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 1;
      animation: modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-header .brand-icon {
      margin: 0 auto 16px auto;
      width: 54px;
      height: 54px;
    }

    .login-header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-header p {
      font-size: 0.84rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-inner);
      color: #fff;
      font-size: 0.92rem;
      font-family: inherit;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--neon-blue);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7 0%, #00cae0 100%);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-inner);
      font-size: 0.94rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 202, 224, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 202, 224, 0.45);
    }

    .divider {
      text-align: center;
      position: relative;
      margin: 26px 0 20px 0;
    }

    .divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border-glass);
    }

    .divider span {
      position: relative;
      background: #0b1120;
      padding: 0 14px;
      font-size: 0.74rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .quick-roles-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--neon-blue);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
      text-align: center;
    }

    .role-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .role-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-inner);
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      text-align: left;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      color: #fff;
    }

    .role-btn:hover {
      border-color: var(--neon-blue);
      background: rgba(56, 189, 248, 0.1);
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.18);
    }

    .role-btn.admin-role {
      border-color: rgba(245, 158, 11, 0.35);
      background: rgba(245, 158, 11, 0.07);
    }

    .role-btn.admin-role:hover {
      border-color: var(--neon-amber);
      background: rgba(245, 158, 11, 0.16);
      box-shadow: 0 0 22px rgba(245, 158, 11, 0.25);
    }

    .role-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .role-btn-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .role-btn-sub {
      font-size: 0.74rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="login-card">

    <div class="login-header">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <h1>Aegis Ambient Care</h1>
      <p>Secure Enterprise Portal &bull; Senior Safety & Telemetry</p>
    </div>

    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <input 
          type="email" 
          id="loginEmail" 
          class="form-input" 
          placeholder="e.g. david.vance@example.com" 
          required 
          value="david.vance@example.com"
        >
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px;">
          <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
          <span style="font-size: 0.74rem; color: var(--neon-blue); cursor: pointer; font-weight: 600;" onclick="togglePassword()">Show</span>
        </div>
        <input 
          type="password" 
          id="loginPassword" 
          class="form-input" 
          placeholder="Enter password" 
          required 
          value="admin123"
        >
      </div>

      <button type="submit" class="btn-submit" id="btnLogin">
        <span>Sign In to Portal</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </form>

    <div class="divider">
      <span>Or 1-Click Role Access</span>
    </div>

    <div class="quick-roles-title">Select Authenticated Profile:</div>

    <div class="role-grid">
      <!-- Role 1: Son David Vance (Admin) -->
      <button class="role-btn admin-role" onclick="quickLogin('admin_son')">
        <div class="role-icon-box" style="color: #fbbf24;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div>
          <div class="role-btn-title" style="color: #fbbf24;">David Vance (Son &bull; Family Admin)</div>
          <div class="role-btn-sub">Full Admin Console &bull; Live Telemetry & Door Overrides</div>
        </div>
      </button>

      <!-- Role 2: Senior / Family Home View -->
      <button class="role-btn" onclick="quickLogin('senior_home')">
        <div class="role-icon-box" style="color: #38bdf8;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <div>
          <div class="role-btn-title">Eleanor & Family (Home View)</div>
          <div class="role-btn-sub">Interactive Safety Dashboard &bull; Multilingual &bull; Voice Test</div>
        </div>
      </button>

      <!-- Role 3: Boston EMS Paramedic -->
      <button class="role-btn" onclick="quickLogin('ems')">
        <div class="role-icon-box" style="color: #ff3b57;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
          </svg>
        </div>
        <div>
          <div class="role-btn-title">Medic 14 (Boston EMS First Responder)</div>
          <div class="role-btn-sub">Emergency CAD Dispatch &bull; Smart Door Token: 8492</div>
        </div>
      </button>
    </div>

  </div>

  <script>
    const USER_PROFILES = {
      admin_son: {
        name: "David Vance (Son)",
        role: "Family Primary Admin",
        email: "david.vance@example.com",
        password: "admin123",
        avatar: "👨‍💼",
        redirect: "/admin"
      },
      senior_home: {
        name: "Eleanor & Family",
        role: "Senior / Family View",
        email: "family@beaconhill.care",
        password: "family123",
        avatar: "👵",
        redirect: "/"
      },
      ems: {
        name: "Boston EMS Medic 14",
        role: "First Responder / Dispatch",
        email: "medic14@bostonems.gov",
        password: "medic123",
        avatar: "🚑",
        redirect: "/admin"
      }
    };

    function togglePassword() {
      const pass = document.getElementById("loginPassword");
      pass.type = pass.type === "password" ? "text" : "password";
    }

    function quickLogin(roleKey) {
      const profile = USER_PROFILES[roleKey];
      if (!profile) return;
      submitUserSession(profile);
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();

      for (const key in USER_PROFILES) {
        if (USER_PROFILES[key].email.toLowerCase() === email) {
          submitUserSession(USER_PROFILES[key]);
          return;
        }
      }

      const target = (email.includes("admin") || email.includes("david")) ? USER_PROFILES.admin_son : USER_PROFILES.senior_home;
      submitUserSession(target);
    }

    function submitUserSession(userObj) {
      localStorage.setItem("aegis_auth_user", JSON.stringify(userObj));
      const btn = document.getElementById("btnLogin");
      btn.innerHTML = '<span>Authenticating...</span>';
      btn.style.opacity = "0.7";
      setTimeout(() => {
        window.location.href = userObj.redirect || "/";
      }, 350);
    }
  </script>

</body>
</html>
