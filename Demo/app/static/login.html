<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIRA — Secure Ambient Care Access</title>
  <meta name="description" content="Secure login and registration portal for residents, caregivers, and first responders.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/dashboard.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
      background-color: var(--bg-deep, #080a10);
      position: relative;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
      top: -100px;
      left: 20%;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
      bottom: -80px;
      right: 20%;
      pointer-events: none;
      z-index: 0;
    }

    .login-card {
      width: 100%;
      max-width: 500px;
      background: var(--bg-surface, rgba(18, 23, 34, 0.95));
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 1;
    }

    .login-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-icon-shield {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px auto;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(6, 182, 212, 0.05) 100%);
      border: 1px solid rgba(56, 189, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
    }

    .login-header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .login-header p {
      font-size: 0.84rem;
      color: var(--text-secondary, #cbd5e1);
      font-weight: 500;
    }

    /* Auth Tab Switcher */
    .auth-tabs-strip {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 22px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 9px 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary, #cbd5e1);
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .auth-tab-btn.active {
      background: rgba(56, 189, 248, 0.2);
      color: #fff;
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.15);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary, #cbd5e1);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      color: #fff;
      font-size: 0.92rem;
      font-family: inherit;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
    }

    .auth-error-box {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fda4af;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }

    .auth-success-box {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
    }

    .btn-submit-primary {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #0284c7 0%, #00cae0 100%);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 202, 224, 0.35);
    }

    .divider-or {
      text-align: center;
      position: relative;
      margin: 22px 0 16px 0;
    }

    .divider-or::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
    }

    .divider-or span {
      position: relative;
      background: #0f1523;
      padding: 0 12px;
      font-size: 0.74rem;
      color: var(--text-muted, #94a3b8);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .demo-roles-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .demo-role-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      color: #fff;
      text-decoration: none;
    }

    .demo-role-btn:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.15);
    }

    .role-icon-circ {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .role-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }

    .role-desc {
      font-size: 0.74rem;
      color: var(--text-secondary, #cbd5e1);
    }
  </style>
</head>
<body>

  <div class="login-card">
    
    <!-- Deployment Mode Disclosure -->
    <div id="authModeBanner" class="auth-mode-banner" style="margin-bottom: 16px; padding: 10px 14px; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 10px; font-size: 0.78rem; color: #94a3b8; display: flex; align-items: center; gap: 8px;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 8px #38bdf8;"></span>
      <span id="authModeBannerText">NIRA Ambient Care &bull; Verified Demo Mode &bull; Non-Invasive Elderly Safety</span>
    </div>

    <div class="login-header">
      <div class="brand-icon-shield">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <h1>NIRA Ambient Care</h1>
      <p>Never Ignore Risk Assistant &bull; Elderly Safety Platform</p>
    </div>

    <!-- Toggle Tabs: Sign In / Sign Up -->
    <div class="auth-tabs-strip" role="tablist">
      <button class="auth-tab-btn active" id="tabBtnSignIn" onclick="switchAuthTab('signin')" role="tab" aria-selected="true" aria-controls="panelSignIn">Sign In</button>
      <button class="auth-tab-btn" id="tabBtnSignUp" onclick="switchAuthTab('signup')" role="tab" aria-selected="false" aria-controls="panelSignUp">Sign Up</button>
    </div>    <!-- SIGN IN PANEL -->
    <div id="panelSignIn" role="tabpanel" aria-labelledby="tabBtnSignIn">
      <div id="loginErrorMsg" class="auth-error-box" role="alert" aria-live="polite"></div>
      <div id="loginErrorAlert" class="auth-error-box" role="alert" style="display: none;"></div>
      <div id="loginSuccessMsg" class="auth-success-box" role="status" style="display: none;"></div>
      <span id="loginEmailError" style="display: none;">Invalid email format</span>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email or Username</label>
          <input 
            type="text" 
            id="loginEmail" 
            class="form-input" autocomplete="username" aria-describedby="loginEmailError" 
            placeholder="e.g. eleanor.vance@beaconhill.care or david.vance@example.com" 
            required 
            value="eleanor.vance@beaconhill.care"
          >
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
            <button type="button" data-password-toggle="loginPassword" aria-pressed="false" style="background: none; border: none; font-size: 0.74rem; color: #38bdf8; cursor: pointer; font-weight: 600;" onclick="togglePassword('loginPassword')">Show/Hide</button>
          </div>
          <input 
            type="password" 
            id="loginPassword" 
            class="form-input" autocomplete="current-password" 
            placeholder="Enter password" 
            required 
            value="demo123"
          >
        </div>

        <button type="submit" class="btn-submit-primary" id="btnLogin">
          <span>Sign In</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
        <div style="text-align: center; margin-top: 10px;">
          <button type="button" id="btnForgotPassword" onclick="openRecoveryModal()" style="background: none; border: none; font-size: 0.78rem; color: #38bdf8; cursor: pointer; text-decoration: underline;">Forgot Password?</button>
        </div>
      </form>

      <div class="divider-or">
        <span>Or 1-Click Demo Profiles</span>
      </div>

      <div class="demo-roles-container">
        <!-- Prominent Demo Button 1: Eleanor Vance (Resident) -->
        <button class="demo-role-btn" id="btnDemoLoginResident" onclick="quickLogin('senior_resident')">
          <div class="role-icon-circ" style="background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.3);">
            👵
          </div>
          <div>
            <div class="role-title">Sign in as Eleanor Vance (Resident)</div>
            <div class="role-desc">Home Dashboard &bull; Daily Check-in &bull; Medication Reminders</div>
          </div>
        </button>

        <!-- Prominent Demo Button 2: David Vance (Caregiver) -->
        <button class="demo-role-btn" id="btnDemoLoginCaregiver" onclick="quickLogin('caregiver_david')">
          <div class="role-icon-circ" style="background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.3);">
            👨‍💼
          </div>
          <div>
            <div class="role-title">Sign in as David Vance (Caregiver)</div>
            <div class="role-desc">Caregiver Dashboard &bull; Emergency Alerts &bull; Sensor Matrix</div>
          </div>
        </button>

        <!-- Optional: First Responder EMS -->
        <button class="demo-role-btn" id="btnDemoLoginEMS" onclick="quickLogin('ems_medic')">
          <div class="role-icon-circ" style="background: rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.3);">
            🚑
          </div>
          <div>
            <div class="role-title">Medic 14 (Boston EMS First Responder)</div>
            <div class="role-desc">Emergency CAD Telemetry &bull; Smart Door Token: 8492</div>
          </div>
        </button>
      </div>
    </div>

    <!-- SIGN UP PANEL -->
    <div id="panelSignUp" role="tabpanel" aria-labelledby="tabBtnSignUp" style="display: none;">
      <div id="signupErrorMsg" class="auth-error-box" role="alert" aria-live="polite"></div>
      <div id="signupSuccessMsg" class="auth-success-box" role="status"></div>
      <span id="signupConfirmPasswordError" style="display: none;">Passwords must match</span>

      <form id="signupForm" onsubmit="handleSignupSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="signupName">Full Name</label>
          <input 
            type="text" 
            id="signupName" 
            class="form-input" autocomplete="name" 
            placeholder="e.g. Margaret Sullivan" 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="signupRole">Account Role</label>
          <select id="signupRole" class="form-input" style="background: #161e2e; color: #fff;">
            <option value="resident">Resident / Senior Citizen</option>
            <option value="caregiver">Family Caregiver / Guardian</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address</label>
          <input 
            type="email" 
            id="signupEmail" 
            class="form-input" autocomplete="email" 
            placeholder="name@example.com" 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="signupCaregiver">Emergency Contact Name &amp; Phone</label>
          <input 
            type="text" 
            id="signupCaregiver" 
            class="form-input" 
            placeholder="e.g. Sarah Sullivan (+1-555-018-4421)" 
            required
          >
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="signupPassword" style="margin-bottom: 0;">Password</label>
            <button type="button" data-password-toggle="signupPassword" aria-pressed="false" style="background: none; border: none; font-size: 0.74rem; color: #38bdf8; cursor: pointer; font-weight: 600;" onclick="togglePassword('signupPassword')">Show/Hide</button>
          </div>
          <input 
            type="password" 
            id="signupPassword" 
            class="form-input" autocomplete="new-password" 
            placeholder="At least 6 characters" 
            required 
            minlength="6"
          >
          <div id="signupStrengthMeter" class="strength-meter" style="display: flex; gap: 4px; margin-top: 6px;">
            <span class="strength-seg" style="flex: 1; height: 4px; border-radius: 2px; background: #38bdf8;"></span>
            <span class="strength-seg" style="flex: 1; height: 4px; border-radius: 2px; background: #38bdf8;"></span>
            <span class="strength-seg" style="flex: 1; height: 4px; border-radius: 2px; background: #94a3b8;"></span>
            <span class="strength-seg" style="flex: 1; height: 4px; border-radius: 2px; background: #94a3b8;"></span>
          </div>
          <div id="signupStrengthLabel" style="font-size: 0.72rem; color: #94a3b8; margin-top: 2px;">Moderate Strength</div>
          <ul id="signupPolicyList" style="font-size: 0.72rem; color: #94a3b8; padding-left: 16px; margin: 4px 0 0 0;">
            <li>At least 6 characters</li>
          </ul>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="signupConfirmPassword" style="margin-bottom: 0;">Confirm Password</label>
            <button type="button" data-password-toggle="signupConfirmPassword" aria-pressed="false" style="background: none; border: none; font-size: 0.74rem; color: #38bdf8; cursor: pointer; font-weight: 600;" onclick="togglePassword('signupConfirmPassword')">Show/Hide</button>
          </div>
          <input 
            type="password" 
            id="signupConfirmPassword" 
            class="form-input" autocomplete="new-password" aria-describedby="signupConfirmPasswordError" 
            placeholder="Re-enter password" 
            required
          >
        </div>

        <button type="submit" class="btn-submit-primary" id="btnSignup">
          <span>Create Account &bull; Start Demo</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </button>
      </form>
    </div>

  </div>

  <script>
const DEMO_PERSONAS = {
      senior_resident: {
        key: "senior_home",
        name: "Eleanor Vance (Resident)",
        role: "Resident / Senior View",
        roleKey: "resident",
        email: "eleanor.vance@beaconhill.care",
        avatar: "👵",
        redirect: "/#demo/homedashboard"
      },
      caregiver_david: {
        key: "admin_son",
        name: "David Vance (Caregiver)",
        role: "Family Primary Caregiver",
        roleKey: "caregiver",
        email: "david.vance@example.com",
        avatar: "👨‍💼",
        redirect: "/#demo/caregiverdashboard"
      },
      ems_medic: {
        key: "ems",
        name: "Medic 14 (Boston EMS First Responder)",
        role: "First Responder / Dispatch",
        roleKey: "ems",
        email: "medic14@bostonems.gov",
        avatar: "🚑",
        redirect: "/#demo/emergencyalert"
      }
    };
    const USER_PROFILES = DEMO_PERSONAS;
        name: "Medic 14 (Boston EMS First Responder)",
        role: "First Responder / Dispatch",
        email: "medic14@bostonems.gov",
        avatar: "🚑",
        redirect: "/#profile=ems"
      }
    };

    function switchAuthTab(mode) {
      const tabIn = document.getElementById("tabBtnSignIn");
      const tabUp = document.getElementById("tabBtnSignUp");
      const panelIn = document.getElementById("panelSignIn");
      const panelUp = document.getElementById("panelSignUp");

      if (mode === "signin") {
        tabIn.classList.add("active");
        tabIn.setAttribute("aria-selected", "true");
        tabUp.classList.remove("active");
        tabUp.setAttribute("aria-selected", "false");
        panelIn.style.display = "block";
        panelUp.style.display = "none";
      } else {
        tabUp.classList.add("active");
        tabUp.setAttribute("aria-selected", "true");
        tabIn.classList.remove("active");
        tabIn.setAttribute("aria-selected", "false");
        panelUp.style.display = "block";
        panelIn.style.display = "none";
      }
    }

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      if (input) {
        input.type = input.type === "password" ? "text" : "password";
      }
    }

    function quickLogin(roleKey) {
      const persona = DEMO_PERSONAS[roleKey];
      if (persona) {
        submitUserSession(persona);
      }
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const pass = document.getElementById("loginPassword").value;
      const errBox = document.getElementById("loginErrorMsg");

      if (!email || !pass) {
        errBox.textContent = "Please fill in all credentials.";
        errBox.style.display = "block";
        return;
      }
      errBox.style.display = "none";

      if (email.includes("david") || email.includes("caregiver") || email.includes("admin")) {
        submitUserSession(DEMO_PERSONAS.caregiver_david);
      } else if (email.includes("medic") || email.includes("ems")) {
        submitUserSession(DEMO_PERSONAS.ems_medic);
      } else {
        submitUserSession(DEMO_PERSONAS.senior_resident);
      }
    }

    function handleSignupSubmit(event) {
      event.preventDefault();
      const name = document.getElementById("signupName").value.trim();
      const role = document.getElementById("signupRole").value;
      const email = document.getElementById("signupEmail").value.trim();
      const pass = document.getElementById("signupPassword").value;
      const confirmPass = document.getElementById("signupConfirmPassword").value;
      const errBox = document.getElementById("signupErrorMsg");
      const succBox = document.getElementById("signupSuccessMsg");

      if (pass !== confirmPass) {
        errBox.textContent = "Passwords do not match. Please re-enter.";
        errBox.style.display = "block";
        return;
      }
      if (pass.length < 6) {
        errBox.textContent = "Password must be at least 6 characters long.";
        errBox.style.display = "block";
        return;
      }
      errBox.style.display = "none";

      const newUser = {
        name: name,
        role: role === "caregiver" ? "Family Caregiver" : "Resident / Senior View",
        roleKey: role,
        email: email,
        avatar: role === "caregiver" ? "👨‍💼" : "👵",
        redirect: role === "caregiver" ? "/#demo/caregiverdashboard" : "/#demo/homedashboard"
      };

      succBox.textContent = `Account created successfully for ${name}! Redirecting to dashboard...`;
      succBox.style.display = "block";

      setTimeout(() => {
        submitUserSession(newUser);
      }, 600);
    }

    function submitUserSession(userObj) {
      localStorage.setItem("aegis_auth_user", JSON.stringify(userObj));
localStorage.setItem("nira_active_profile", userObj.key || userObj.roleKey || "senior_home");
      localStorage.setItem("nira_demo_auth", JSON.stringify(userObj));
      const btn = document.getElementById("btnLogin") || document.getElementById("btnSignup");
      if (btn) {
        btn.innerHTML = '<span>Entering NIRA Portal...</span>';
        btn.style.opacity = "0.75";
      }
      setTimeout(() => {
        window.location.href = userObj.redirect || "/";
      }, 350);
    }
  </script>


  <!-- Password Recovery Dialog Modal -->
  <div id="authRecoveryBackdrop" class="recovery-backdrop" role="dialog" aria-modal="true" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center;">
    <div class="recovery-card" style="background: #111827; border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 28px; width: 90%; max-width: 440px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0; font-size: 1.15rem; color: #fff;">Reset Password</h3>
        <button type="button" id="btnRecoveryClose" onclick="closeRecoveryModal()" style="background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer;">&times;</button>
      </div>
      <form id="recoveryForm" onsubmit="event.preventDefault();">
        <div class="form-group" style="margin-bottom: 12px;">
          <label class="form-label" for="recoveryEmail">Account Email</label>
          <input type="email" id="recoveryEmail" class="form-input" autocomplete="email" placeholder="name@example.com" required style="width: 100%;">
        </div>
        <div class="form-group" style="margin-bottom: 12px;">
          <label class="form-label" for="recoveryNewPassword">New Password</label>
          <input type="password" id="recoveryNewPassword" class="form-input" autocomplete="new-password" placeholder="New password" required style="width: 100%;">
          <div class="strength-meter" style="display: flex; gap: 4px; margin-top: 6px;">
            <span class="strength-seg" style="flex: 1; height: 4px; border-radius: 2px; background: #38bdf8;"></span>
            <span class="strength-seg" style="flex: 1; height: 4px; border-radius: 2px; background: #38bdf8;"></span>
            <span class="strength-seg" style="flex: 1; height: 4px; border-radius: 2px; background: #38bdf8;"></span>
            <span class="strength-seg" style="flex: 1; height: 4px; border-radius: 2px; background: #94a3b8;"></span>
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label" for="recoveryConfirmPassword">Confirm New Password</label>
          <input type="password" id="recoveryConfirmPassword" class="form-input" autocomplete="new-password" placeholder="Confirm password" required style="width: 100%;">
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" id="btnRecoverySubmit" class="btn-submit-primary" style="flex: 1;">Save New Password</button>
          <button type="reset" id="btnRecoveryReset" style="padding: 10px 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #cbd5e1; cursor: pointer;">Reset</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function openRecoveryModal() {
      const el = document.getElementById("authRecoveryBackdrop");
      if (el) el.style.display = "flex";
    }
    function closeRecoveryModal() {
      const el = document.getElementById("authRecoveryBackdrop");
      if (el) el.style.display = "none";
    }
  </script>

</body>
</html>
