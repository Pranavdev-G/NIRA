<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIRA — Ambient Care AI Platform</title>
  <meta name="description" content="NIRA Ambient Care - Select Demo Mode or Live Real-Time Ingestion System.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --bg-dark: #050b14;
      --bg-card: rgba(13, 23, 42, 0.7);
      --border-glow: rgba(0, 229, 255, 0.22);
      --cyan-neon: #00e5ff;
      --cyan-gradient: linear-gradient(135deg, #00e5ff 0%, #0284c7 50%, #2563eb 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 25%, rgba(0, 229, 255, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(37, 99, 235, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.04) 0%, transparent 60%);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      overflow-x: hidden;
    }

    /* Top User Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 11, 20, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      z-index: 100;
    }

    .top-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      color: #fff;
    }

    .top-brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid rgba(0, 229, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan-neon);
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 6px 16px;
      font-size: 0.82rem;
    }

    .user-pill strong { color: var(--cyan-neon); }

    .btn-signout {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-signout:hover {
      background: rgba(239, 68, 68, 0.15);
      color: #fff;
    }

    /* Main Gateway Card Layout */
    .gateway-wrapper {
      width: 100%;
      max-width: 960px;
      text-align: center;
      margin-top: 40px;
    }

    .shield-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border-radius: 20px;
      background: rgba(0, 229, 255, 0.08);
      border: 1.5px solid rgba(0, 229, 255, 0.35);
      color: var(--cyan-neon);
      margin-bottom: 20px;
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.25);
    }

    .main-logo-title {
      font-family: var(--font-display);
      font-size: 4.2rem;
      font-weight: 900;
      letter-spacing: 0.28em;
      margin-left: 0.28em;
      background: linear-gradient(135deg, #ffffff 40%, #7dd3fc 80%, #00e5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      text-shadow: 0 0 50px rgba(0, 229, 255, 0.3);
    }

    .main-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 48px;
    }

    /* Exactly the Two Mode Cards (Demo vs Live) */
    .modes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      margin-bottom: 30px;
    }

    @media (max-width: 768px) {
      .modes-grid { grid-template-columns: 1fr; }
      .main-logo-title { font-size: 3rem; }
    }

    .mode-card {
      background: var(--bg-card);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 48px 36px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      transition: all 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .mode-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 0%, rgba(0, 229, 255, 0.15) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .mode-card:hover {
      transform: translateY(-8px);
      border-color: var(--cyan-neon);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 229, 255, 0.25);
    }

    .mode-card:hover::before { opacity: 1; }

    .mode-card-title {
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.25;
      margin-bottom: 24px;
    }

    .mode-circle-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: all 0.25s ease;
    }

    .mode-card:hover .mode-circle-btn {
      background: var(--cyan-gradient);
      border-color: transparent;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.5);
      transform: scale(1.1);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .demo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }
  </style>
</head>
<body>

  <!-- Top User Profile & Caretaker Bar -->
  <header class="top-bar">
    <div class="top-brand">
      <div class="top-brand-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <span>NIRA AMBIENT CARE</span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="user-pill">
        <span>Caretaker: <strong id="barCaretakerName">Dharaneesh N</strong></span>
        <span style="color: var(--text-muted);">&bull;</span>
        <span id="barCaretakerPhone">📱 9489240892</span>
      </div>
      <button class="btn-signout" onclick="handleSignOut()">Sign Out</button>
    </div>
  </header>

  <!-- Main Center Choice: Demo Mode vs Live Mode -->
  <div class="gateway-wrapper">
    <div class="shield-badge">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>

    <h1 class="main-logo-title">NIRA</h1>
    <p class="main-subtitle">Choose operational stream below</p>

    <!-- ONLY the Demo and Live Viewing Stuff Displayed -->
    <div class="modes-grid">
      <!-- 1. HACKATHON SHOWCASE (DEMO MODE) -->
      <a class="mode-card" href="/demo" id="cardDemoMode" title="Enter Demo Simulation Environment">
        <div class="demo-badge">
          <span class="pulse-dot"></span>
          <span>TEAM BRANCH DEMO</span>
        </div>
        <div class="mode-card-title">HACKATHON<br>SHOWCASE</div>
        <div class="mode-circle-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </div>
      </a>

      <!-- 2. REAL-TIME INGESTION (LIVE MODE) -->
      <a class="mode-card" href="/live" id="cardLiveMode" title="Enter Real-Time Live Vision, Automatic Voice Mic, & Emergency System">
        <div class="live-badge">
          <span class="pulse-dot"></span>
          <span>REAL-TIME LIVE SYSTEM</span>
        </div>
        <div class="mode-card-title">REAL-TIME<br>INGESTION</div>
        <div class="mode-circle-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </div>
      </a>
    </div>
  </div>

  <script>
    // Enforce Authentication: If not logged in, redirect to login
    function checkAuth() {
      const token = localStorage.getItem('nira_auth_token');
      const cgStr = localStorage.getItem('nira_caregiver');

      if (!token && !cgStr) {
        window.location.href = '/login';
        return;
      }

      if (cgStr) {
        try {
          const cg = JSON.parse(cgStr);
          document.getElementById('barCaretakerName').textContent = cg.name || cg.caretaker_name || 'Dharaneesh N';
          document.getElementById('barCaretakerPhone').textContent = `📱 ${cg.mobile || cg.mobile_number || '9489240892'}`;
        } catch(e) {}
      }
    }

    function handleSignOut() {
      localStorage.removeItem('nira_auth_token');
      localStorage.removeItem('nira_caregiver');
      localStorage.removeItem('nira_patient');
      fetch('/api/v1/live/auth/logout', { method: 'POST' }).finally(() => {
        window.location.href = '/login';
      });
    }

    checkAuth();
  </script>
</body>
</html>
